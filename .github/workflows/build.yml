name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # The parts that don't need a 3DS (setup code, records, agenda, QR reading), on the computer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install segno
      - run: make -f tests/Makefile

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-zlib citro2d citro3d libctru
      - name: Trusted certificates for HTTPS
        run: curl -sSfL https://curl.se/ca/cacert.pem -o romfs/cacert.pem
      - run: make
      - name: Installable .cia (FBI, 3DSDL)
        run: |
          apt-get update -qq && apt-get install -y -qq unzip >/dev/null
          apt-get install -y -qq git cmake make g++ >/dev/null
          git clone -q --depth 1 --branch makerom-v0.19.0 https://github.com/3DSGuy/Project_CTR.git ctr
          make -C ctr/makerom deps >/dev/null && make -C ctr/makerom -j4 >/dev/null
          install -m755 "$(find ctr/makerom -name makerom -type f | head -1)" /usr/local/bin/
          git clone -q --depth 1 --branch 1.2.3 --recursive https://github.com/carstene1ns/3ds-bannertool.git bt
          cmake -S bt -B bt/out >/dev/null && cmake --build bt/out >/dev/null
          install -m755 "$(find bt/out -name bannertool -type f | head -1)" /usr/local/bin/
          sh cia/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quire-3ds
          path: |
            quire.3dsx
            quire.cia

  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quire-3ds
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --title "Quire for 3DS $version" --notes "$notes" quire.3dsx quire.cia
